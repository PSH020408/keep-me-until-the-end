<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>살아남아라! 끝까지!</title>
<meta name="description" content="관상어 23종 중 한 마리가 되어, 훈련하고 스킬을 익혀 사람이 만든 억까를 끝까지 이겨 내는 물고기 육성 서바이벌 웹게임 (베타).">
<meta property="og:title" content="살아남아라! 끝까지!">
<meta property="og:description" content="물고기 한 마리, 억까 투성이 수조. 훈련하고 버텨라 — 관상어 육성 서바이벌 베타">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:url" content="https://keep-me-until-the-end.onrender.com/">
<meta property="og:image" content="https://keep-me-until-the-end.onrender.com/og.png">
<link rel="canonical" href="https://keep-me-until-the-end.onrender.com/">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#EEF5E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#EEF5E6" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Nanum+Pen+Script&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/creatures.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body class="gx-title">
<div class="wrap">
  <section id="intro" class="sheet title-screen">
    <div class="ts-bubbles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="title"><span class="label">관상어 23종 · 육성 서바이벌<span class="beta">BETA</span></span><h1>살아남아라!</h1><span class="sub">끝까지!</span></div>
    <ol class="pledges" id="introPledges" hidden></ol>
    <input id="nick" type="hidden" value=""><span id="sheetOwner" hidden></span><p class="nickmsg" id="nickMsg" hidden></p>
    <div class="modepick" id="modePick" role="group" aria-label="난이도"><span class="label">난이도</span><button type="button" data-mode="story" aria-pressed="true">쉬움</button><button type="button" data-mode="real" aria-pressed="false">어려움</button><span class="modedesc" id="modeDesc" hidden></span></div>
    <div class="row"><button class="btn ts-start" id="startBtn">▶ 시작하기</button></div>
  </section>

  <div id="tut" class="tut" hidden role="dialog" aria-modal="true" aria-labelledby="tutH">
    <div class="tut-card"><button type="button" class="tut-x" aria-label="닫기">✕</button><span class="label tut-n"></span><h3 class="tut-h" id="tutH"></h3><p class="tut-p"></p>
      <div class="row"><button type="button" class="btn ghost tut-prev">이전</button><button type="button" class="btn tut-next">다음</button></div></div>
  </div>
  <div id="slot" class="slot" hidden aria-live="polite">
    <div class="slot-card">
      <span class="label">무작위 · 관상어 23종</span>
      <div class="reel"><div class="strip" id="slotStrip"></div><span class="mark l">▶</span><span class="mark r">◀</span></div>
      <p class="slot-name" id="slotName">&nbsp;</p>
      <span class="slot-hint">누르면 바로 넘어갑니다</span>
    </div>
  </div>

  <div id="lantern" class="lantern" hidden role="dialog" aria-label="육성 기록">
    <div class="lan-card">
      <div class="lan-head"><img id="lanImg" alt=""><div><p class="lan-name" id="lanName"></p><span class="label" id="lanMeta"></span></div></div>
      <div class="lan-film" id="lanFilm" title="누르면 멈춥니다"></div>
      <div class="lan-ctl" id="lanCtl"><button type="button" id="lanPrev">◀ 이전</button><button type="button" id="lanHold">❚❚ 멈춤</button><button type="button" id="lanNext">다음 ▶</button><span class="pos" id="lanPos"></span><button type="button" id="lanSkip">정리 보기</button></div>
      <div class="lan-sum" id="lanSum" hidden></div>
      <div class="row"><button class="btn ghost" id="lanAgain">다시 보기</button><button class="btn" id="lanClose">닫기</button></div>
    </div>
  </div>

  <section id="game" hidden>
    <div id="playGrid">
    <div class="sheet" id="card">
      <div class="row cardtop"><span class="label" id="cardNo"></span><span class="label" id="cardSex"></span><button type="button" class="infobtn" id="infoBtn" aria-expanded="false">정보 ▾</button><button type="button" class="infobtn helpbtn" id="helpBtn" aria-label="도움말">?</button></div>
      <div class="head">
        <div class="info">
          <h2 class="species" id="spName"></h2>
          <div class="sci" id="spSci"></div>
          <div class="mrow" id="fishRow"><span class="mhead">물고기</span><div class="meters">
            <div class="meter" id="mHealth"><div class="top"><span>건강</span><span class="v"></span></div><div class="track"><div class="fill"></div></div></div>
            <div class="meter" id="mPow" hidden><div class="top"><span>힘</span><span class="v"></span></div><div class="track"><div class="fill"></div></div></div>
            <div class="meter" id="mGuts" hidden><div class="top"><span>근성</span><span class="v"></span></div><div class="track"><div class="fill"></div></div></div>
            <div class="meter" id="mWits" hidden><div class="top"><span>지능</span><span class="v"></span></div><div class="track"><div class="fill"></div></div></div>
            <div class="meter" id="mCharm" hidden><div class="top"><span>매력</span><span class="v"></span></div><div class="track"><div class="fill"></div></div></div>
          </div></div>
          <div class="mrow" id="ownRow"><span class="mhead" id="ownHead">주인 몫</span><div class="meters">
            <div class="meter" id="mSkill" hidden><div class="top"><span><span class="long">주인 </span>실력</span><span class="v"></span></div><div class="track"><div class="fill"></div></div></div>
            <div class="meter" id="mTemp" hidden><div class="top"><span>수온</span><span class="v"></span></div><div class="track"><div class="fill"></div></div></div>
            <div class="meter" id="mWq" hidden><div class="top"><span>수질</span><span class="v"></span></div><div class="track"><div class="fill"></div></div></div>
            <div class="meter" id="mCare"><div class="top"><span id="careLabel">보살핌</span><span class="v"></span></div><div class="track"><div class="fill"></div></div></div>
          </div></div>
          <dl class="fields" id="fields"></dl>
        </div>
        <div class="stagewrap"><div id="stage"></div><div class="chips" id="chips"></div></div>
      </div>
      <div class="life"><div class="top"><span id="ageNow"></span><span id="ageMax"></span></div><div class="track"><div class="fill" id="ageFill"></div></div>
        <div class="tick"><span id="stepLabel"></span><div class="track"><div class="fill" id="tickFill"></div></div></div></div>
      <!-- the pledges are kept here for the record; they are shown on the ending, with the broken ones struck out -->
      <ol class="pledges" id="gamePledges" hidden></ol>
    </div>
    <div class="controls">
      <button id="playBtn" aria-pressed="true">▶ 플레이</button>
      <button id="stopBtn" aria-pressed="false">■ 정지</button>
      <button data-speed="1" aria-pressed="true">1×</button>
      <button data-speed="2" aria-pressed="false">2×</button>
      <button data-speed="4" aria-pressed="false">4×</button>
      <button data-speed="8" aria-pressed="false">8×</button>
      <button data-speed="16" aria-pressed="false">16×</button>
      <button data-speed="32" aria-pressed="false">32×</button>
      <button id="speedCycle" class="m-only" aria-label="배속 바꾸기">1×</button>
      <span class="sp"></span>
      <button id="skipBtn">마지막까지</button>
    </div>
    <div class="choice sheet" id="choice" hidden></div>
    <div class="ending sheet" id="ending" hidden></div>
    <div class="logwrap"><div class="loghead"><span>기록</span><span class="lognote"></span></div><ul class="log" id="log"></ul></div>
    </div>
  </section>

  <section class="memorial">
    <h3>육성 기록</h3>
    <p class="summary" id="memSummary"></p>
    <ul class="mem" id="memList"></ul>
    <div class="row memtools" id="memTools" hidden><button type="button" class="btn ghost" id="memMore">모두 보기</button><button type="button" class="btn ghost" id="memClear">모두 지우기</button></div>
  </section>

  <section class="memorial pub" id="pubSec" hidden>
    <h3>모두의 육성 기록</h3>
    <p class="summary" id="pubSummary"></p>
    <ul class="mem" id="pubList"></ul>
    <div class="row memtools"><button type="button" class="btn ghost" id="pubMore" hidden>더 보기</button></div>
  </section>

  <p class="foot"><span class="ver">베타 v0.18.1 · 관상어 데이 · PARK, SEHO</span></p>
</div>

<!-- load order matters: later files use what earlier files declare -->

<script src="js/data/species.js"></script>

<script src="js/data/fishchoice.js"></script>
<script src="js/engine.js"></script>
<script src="js/fish.js"></script>
<script src="js/data/fishgrow.js"></script>
<script src="js/data/fishplus.js"></script>
<script src="js/data/fev.js"></script>
<script src="js/data/fev_0pro.js"></script>
<script src="js/data/fev_core.js"></script>
<script src="js/data/fev_health.js"></script>
<script src="js/data/fev_home.js"></script>
<script src="js/data/fev_mates.js"></script>
<script src="js/data/fev_oldend.js"></script>
<script src="js/data/fev_oldfix.js"></script>
<script src="js/data/fev_origin.js"></script>
<script src="js/data/fev_ownA.js"></script>
<script src="js/data/fev_ownB.js"></script>
<script src="js/data/fev_track.js"></script>
<script src="js/data/fev_trade.js"></script>
<script src="js/data/fev_wild.js"></script>
<script src="js/data/fev_zgrow.js"></script>
<script src="js/data/fev_zz_career.js"></script>
<script src="js/data/fev_zz_fun.js"></script>
<script src="js/art/paint.js"></script>
<script src="js/art/look.js"></script>
<script src="js/art/raster.js"></script>
<script src="js/art/mammals.js"></script>
<script src="js/art/others.js"></script>
<script src="js/art/gags.js"></script>
<script src="js/art/death.js"></script>
<script src="js/art/fish.js"></script>
<script src="js/art.js"></script>
<script src="js/ui.js"></script>
<script src="js/share.js"></script>
</body>
</html>
